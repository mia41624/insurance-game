            position: relative;
            min-height: 90vh;
            display: flex;
            flex-direction: column;

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef2f5;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .phase-indicator {
            text-align: center;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* 遊戲區域 */
        .game-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 卡牌通用樣式 */

            border-radius: 12px;
            padding: 16px;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            background-color: rgba(255,255,255,0.2);
        }

        .card-blue { background: linear-gradient(135deg, #42a5f5, #1565c0); }
        .card-red { background: linear-gradient(135deg, #ef5350, #c62828); }

            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .card-desc {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-bottom: 8px;
            line-height: 1.3;
        }

            font-size: 0.9rem;
            background: rgba(0,0,0,0.2);
            padding: 6px 10px;
            border-radius: 6px;

            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 10px;
            min-height: 60px;
        }
        .equipment-title {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 6px;
        }

            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

            background: #1565c0;
            color: white;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
        }

            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-group button {
            flex: 1;

            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;

            cursor: not-allowed;

            min-width: 85px !important;
            max-width: 85px !important;
            padding: 8px 0 !important;
            text-align: center !important;
            font-size: 0.85rem !important;

            background: rgba(0,0,0,0.75);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;

            opacity: 1;
            pointer-events: auto;
        }

            background: white;
            width: 85%;
            border-radius: 16px;
            padding: 20px;
            text-align: center;

            margin-bottom: 10px;
            text-shadow: 1px 1px 2px #bbdefb;

// 洗牌函式
function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

// 初始化遊戲（含開始前的規則說明彈窗）
function initGame() {
    gameState.round = 1;
    gameState.hp = 5;
    gameState.coin = 10;
    gameState.equipped = [];
    currentCategory = '保險卡'; // 重設防禦商店分類為預設值

    gameState.redDeck = shuffle([...RED_CARDS]);
    updateUI();
    
    // 渲染第一回合畫面準備好
    startPhase1();

    // 遊戲一開始先跳出「規則說明彈窗」
    showGameTutorial();
}

// 更新 UI 狀態欄
function updateUI() {
    document.getElementById('hp-val').innerText = gameState.hp;
    document.getElementById('coin-val').innerText = gameState.coin;
    document.getElementById('round-val').innerText = gameState.round;

    // 更新裝備區
    const eqContainer = document.getElementById('eq-list');
    if (gameState.equipped.length === 0) {
        eqContainer.innerHTML = `<span style="font-size: 0.8rem; color:#aaa;">尚未購買任何防禦卡</span>`;
    } else {
        eqContainer.innerHTML = gameState.equipped.map(id => {
            const card = BLUE_CARDS.find(b => b.id === id);
            let catIcon = card.category === '保險卡' ? '📄' : card.category === '觀念卡' ? '💡' : '⚙️';
            return `<span class="eq-badge">${catIcon} ${card.title}</span>`;
        }).join('');
    }
}

// --- 階段 1：抽取生活樂活卡 ---
function startPhase1() {
    updateUI(); // 👈 關鍵修正：進入階段 1 時先更新右上角狀態（包含回合數）
    
    document.getElementById('phase-text').innerText = `第 ${gameState.round} 回合 - 階段 1：樂活體驗`;
    gameState.currentGreen = gameState.greenDeck.pop();
    const card = gameState.currentGreen;

    const gameArea = document.getElementById('game-area');
    gameArea.innerHTML = `
        <div class="card card-green">
            <img src="${card.img}" alt="${card.title}">
            <div class="card-title">🟢 ${card.title}</div>
            <div class="card-desc">"${card.desc}"</div>
            <div class="card-effect">
                代價：${card.costHp > 0 ? '💔扣'+card.costHp+'血 ' : ''}${card.costCoin > 0 ? '💸扣'+card.costCoin+'金幣 ' : ''}
                ${(card.costHp===0 && card.costCoin===0)?'免費':''}<br>
                效果：${card.addHp > 0 ? '💚補'+card.addHp+'血 ' : ''}${card.addCoin > 0 ? '💰賺'+card.addCoin+'金幣' : ''}
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-success" onclick="useGreenCard(true)">享受樂活</button>
            <button class="btn-secondary" onclick="useGreenCard(false)">跳過 pass</button>
        </div>
    `;
}

function useGreenCard(choice) {
    if (choice) {
        const card = gameState.currentGreen;
        
        // 修正：只有當卡牌「需要花費金幣 (costCoin > 0)」且「玩家金幣不足」時才擋下
        if (card.costCoin > 0 && gameState.coin < card.costCoin) {
            alert("金幣不足，無法執行此活動！");
            return;
        }

        // 扣除/增加金幣與血條
        gameState.coin = gameState.coin - card.costCoin + card.addCoin;
        gameState.hp = gameState.hp - card.costHp + card.addHp;
        
        if (checkGameOver()) return;
    }
    updateUI();
    startPhase2();
}

// --- 階段 2：購買產險防禦卡（分類分頁版） ---
function startPhase2() {
    document.getElementById('phase-text').innerText = `第 ${gameState.round} 回合 - 階段 2：防禦整備`;
    renderShopView();
}

function switchCategory(cat) {
    currentCategory = cat;
    renderShopView();
}

function renderShopView() {
    const gameArea = document.getElementById('game-area');
    
    // 過濾出尚未購買且屬於目前分類的卡片
    const availableShop = BLUE_CARDS.filter(b => !gameState.equipped.includes(b.id) && b.category === currentCategory);

    // 分類 Tab HTML
    const categories = ['保險卡', '觀念卡', '設備卡'];
    const tabsHTML = `
        <div style="display: flex; gap: 6px; margin-bottom: 10px;">
            ${categories.map(cat => `
                <button onclick="switchCategory('${cat}')" style="
                    flex: 1; 
                    padding: 8px 0; 
                    font-size: 0.85rem; 
                    border-radius: 8px;
                    border: none;
                    font-weight: bold;
                    background: ${currentCategory === cat ? '#1565c0' : '#e0e0e0'};
                    color: ${currentCategory === cat ? '#fff' : '#444'};
                    cursor: pointer;
                ">
                    ${cat}
                </button>
            `).join('')}
        </div>
    `;

    // 防禦卡商品列表
    let shopHTML = availableShop.map(card => `
        <div class="shop-item" style="display: flex; gap: 10px; align-items: center; background: #fff; padding: 10px; border-radius: 10px; border: 1px solid #e0e0e0; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <img src="${card.img}" alt="${card.title}" style="width: 70px; height: 70px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: #1565c0;">
            <div style="flex-grow: 1; text-align: left;">
                <div style="font-weight: bold; color: #1565c0; font-size: 0.9rem;">🔵 ${card.title}</div>
                <div style="font-size: 0.78rem; color: #666; margin: 2px 0; line-height: 1.2;">${card.desc}</div>
                <div style="font-size: 0.8rem; font-weight: bold; color: #e65100;">代價：💸 ${card.costCoin} 金幣</div>
            </div>
            <button class="btn-primary" 
                onclick="buyBlueCard('${card.id}')" ${gameState.coin < card.costCoin ? 'disabled' : ''}>
                ${gameState.coin < card.costCoin ? '金幣不足' : '購買'}
            </button>
        </div>
    `).join('');

    gameArea.innerHTML = `
        ${tabsHTML}
        <div class="def-shop-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; padding-right: 4px;">
            ${shopHTML.length > 0 ? shopHTML : `<div style="text-align:center; padding:30px; color:#666;">🎉 目前類別（${currentCategory}）已無可購買項目！</div>`}
        </div>
        <div class="btn-group" style="margin-top: 10px;">
            <button class="btn-success" onclick="startPhase3()">整備完成，迎向命運！</button>
        </div>
    `;
}

function buyBlueCard(cardId) {
    const card = BLUE_CARDS.find(b => b.id === cardId);
    if (gameState.coin >= card.costCoin) {
        gameState.coin -= card.costCoin;
        gameState.equipped.push(cardId);
        updateUI();
        renderShopView(); // 購買後重新渲染當前分類商店
    }
}

// --- 階段 3：盲抽命運風險卡與對應結算 ---
function startPhase3() {
    document.getElementById('phase-text').innerText = `第 ${gameState.round} 回合 - 階段 3：命運降臨`;
    
    gameState.currentRed = gameState.redDeck.pop();
    const card = gameState.currentRed;

    // 檢查是否有對應的防禦卡
    let triggeredDefId = null;
    if (card.defenders) {
        for (let eqId of gameState.equipped) {
            if (card.defenders[eqId]) {
                triggeredDefId = eqId;
                break; // 觸發第一個可防禦的卡
            }
        }
    }

    const gameArea = document.getElementById('game-area');
    gameArea.innerHTML = `
        <div class="card card-red">
            <img src="${card.img}" alt="${card.title}">
            <div class="card-title">🔴 ${card.title}</div>
            <div class="card-desc">"${card.desc}"</div>
            <div class="card-effect">
                裸奔懲罰：💸 扣 ${card.punishCoin} 金幣 / 💔 扣 ${card.punishHp} 血量
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-danger" onclick="resolveFate('${triggeredDefId}')">面對命運！</button>
        </div>
    `;
}

function resolveFate(defId) {
    const redCard = gameState.currentRed;

    if (defId && defId !== 'null') {
        // --- 產險啟動成功 ---
        const defRule = redCard.defenders[defId];
        const blueCard = BLUE_CARDS.find(b => b.id === defId);

        gameState.coin -= defRule.coin;
        gameState.hp -= defRule.hp; // 注意：hp 為負代表加血

        showModal(`
            <div class="activate-title">🛡️ 產險啟動！</div>
            <p><strong>對應防禦：${blueCard.title}</strong></p>
            <p style="color:#2e7d32; font-weight:bold; font-size:1.1rem;">${defRule.msg}</p>
            <button class="btn-success" onclick="closeModalAndNext()">太好了！下一回合</button>
        `);
    } else {
        // --- 無防禦，裸奔懲罰 ---
        gameState.coin -= redCard.punishCoin;
        gameState.hp -= redCard.punishHp;

        showModal(`
            <div style="color:#c62828; font-size:1.8rem; font-weight:bold;">💥 遭受重創！</div>
            <p>沒有對應的防禦卡，只能硬槓風險！</p>
            <p style="color:#c62828;">損失：💸 ${redCard.punishCoin} 金幣 / 💔 ${redCard.punishHp} 點血條</p>
            <button class="btn-danger" onclick="closeModalAndNext()">忍痛接受...</button>
        `);
    }
}

// 結算回合與被動加成
function closeModalAndNext() {
    closeModal();
    
    if (checkGameOver()) return;

    // 處理裝備的被動補血效果（如：斷路器、防禦套裝、餵食器）
    gameState.equipped.forEach(eqId => {
        const bCard = BLUE_CARDS.find(b => b.id === eqId);
        if (bCard && bCard.passiveHp > 0) {
            gameState.hp += bCard.passiveHp;
        }
    });

    // 判斷是否進入下一回合
    if (gameState.round < 3) {
        gameState.round++; // 👈 先把回合數 +1
        startPhase1();     // 👈 再進入階段 1（此時 startPhase1 裡面的 updateUI 就會把右上角更新成第 2 或第 3 回合）
    } else {
        showFinalResult();
    }
}

// --- 檢測勝敗與水逆爆牌彈窗 ---

        gameState.hp = 0;
        updateUI();

        // 預設的 9:16 迷因圖範例（請替換為你的圖片路徑，如 'images/game_over_9_16.png'）

        rankMeme = "【極致精算避險】";
        badgeColor = "#ff8f00"; // 琥珀金
        rankDesc = "極度優秀的操作！你展現了高超的戰術頭腦，不僅樂活享受生活，更打造了牢不可破的產險防護網。遭遇衰事依然毫髮無傷，資產與精神值雙雙爆表！";
    } else if (totalScore >= 45) {
        // 級距 4：45~54 分 (翡翠級 - 新增)
        rankTitle = "🌟 避險大師・資產神盾局長";
        rankMeme = "【全方位超前部署】";
        badgeColor = "#2e7d32"; // 翡翠綠
        rankDesc = "完美的風險控管！你知道什麼時候該享受、什麼時候該買好裝備防禦。就算遇到泡水車或班機延誤，產險一啟動依然老神在在，生活過得優雅又安心！";
    } else if (totalScore >= 30) {
        // 級距 5：30~44 分 (優等生)
        rankTitle = "🛡️ 平安小資・順風順水幸運兒";
        rankMeme = "【穩紮穩打過生活】";
        badgeColor = "#1976d2"; // 質感藍
        rankDesc = "恭喜順利通關！雖然途中遇到一些小波折，但靠著基本防衛與樂活補血，依然平平安安地存活下來，平安就是最大的福氣！";
    } else if (totalScore >= 15) {
        // 級距 6：15~29 分 (險勝)
        rankTitle = "🩹 殘血倖存者・水逆重災戶";
        rankMeme = "【捏著冷汗勉強過關】";
        badgeColor = "#d32f2f"; // 警告紅
        rankDesc = "呼～好險保住一條小命！你這三回合過得心驚膽跳，裸奔被爆打好幾次，錢包差點掏空、血條險些歸零。下次記得把產險買齊買滿再出門啊！";
    } else {
        // 級距 7：14 分以下 (低空飛過)
        rankTitle = "💸 破產地獄犬・地表最強衰神";
        rankMeme = "【雖然活著但全身是傷】";
        badgeColor = "#424242"; // 黯淡灰
        rankDesc = "居然還能活著？！雖然勉強沒有爆牌，但你的口袋已經比洗過的衣服還乾淨，心靈也滿是創傷。這不是水逆，這是水星直接砸在你頭上了吧！建議快去廟裡收驚！";
    }

    // 顯示結果彈窗
    showModal(`
        <h2>🎉 通關成功！遊戲結束</h2>
        <div style="background:#f0f4f8; padding:12px; border-radius:10px; margin:10px 0;">
            <p style="margin:4px 0;">最終血條：❤️ ${gameState.hp} × 3 = <strong>${gameState.hp * 3} 分</strong></p>
            <p style="margin:4px 0;">最終金幣：🪙 ${gameState.coin} = <strong>${gameState.coin} 分</strong></p>
            <hr style="border:0; border-top:1px dashed #ccc; margin:8px 0;">
            <h3 style="color:#1565c0; margin:4px 0; font-size:1.5rem;">總結算分數：${totalScore} 分</h3>
        </div>
        
        <div style="border:2px solid ${badgeColor}; border-radius:12px; padding:12px; background:#fff;">
            <span style="font-size:0.8rem; color:${badgeColor}; font-weight:bold;">${rankMeme}</span>
            <h3 style="color:${badgeColor}; margin:6px 0 10px 0; font-size:1.2rem;">${rankTitle}</h3>
            <p style="font-size:0.88rem; color:#444; line-height:1.4; text-align:left; margin:0;">${rankDesc}</p>
        </div>

        <button class="btn-success" style="margin-top:15px;" onclick="closeModal(); initGame();">挑戰更高的極限！</button>
    `);
}

// --- Modal 控制 ---
function showModal(htmlContent) {
    document.getElementById('modal-content').innerHTML = htmlContent;
    document.getElementById('modal').classList.add('active');
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

// 開局初始化
window.onload = initGame;
</script>
</body>
</html>
